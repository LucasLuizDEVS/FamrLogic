<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>FarmLogic - Nova Fazenda</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
}

body {
    background: #f4f7fa;
    min-height: 100vh;
    padding: 40px;
}

.container {
    max-width: 700px;
    margin: auto;
    background: #fff;
    padding: 35px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
}

.header {
    margin-bottom: 30px;
}

.header h1 {
    color: #2d3748;
    font-size: 30px;
}

.header p {
    color: #718096;
    margin-top: 6px;
}

.form-group {
    margin-bottom: 22px;
}

label {
    display: block;
    margin-bottom: 8px;
    color: #2d3748;
    font-weight: 600;
}

input {
    width: 100%;
    padding: 14px 16px;
    border: 1px solid #cbd5e0;
    border-radius: 12px;
    font-size: 15px;
    outline: none;
    transition: 0.2s;
}

input:focus {
    border-color: #2F855A;
    box-shadow: 0 0 0 3px rgba(47,133,90,0.15);
}

.actions {
    display: flex;
    justify-content: space-between;
    margin-top: 30px;
}

.btn {
    border: none;
    padding: 13px 24px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
    transition: 0.3s;
}

.btn-salvar {
    background: #2F855A;
    color: #fff;
}

.btn-salvar:hover {
    background: #276749;
    transform: translateY(-2px);
}

.btn-voltar {
    background: #edf2f7;
    color: #2d3748;
}

.btn-voltar:hover {
    background: #e2e8f0;
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>🌱 Nova Fazenda</h1>
        <p>Cadastre uma nova propriedade no FarmLogic</p>
    </div>

    <form method="POST" action="/nova-fazenda">

        <div class="form-group">
            <label>Nome da Fazenda</label>
            <input type="text" name="nome" placeholder="Ex: Fazenda Santa Maria" required>
        </div>

        <div class="form-group">
            <label>Localização</label>
            <input type="text" name="localizacao" placeholder="Ex: Uberlândia - MG" required>
        </div>

        <div class="form-group">
            <label>Hectares</label>
            <input type="number" step="0.01" name="hectares" placeholder="Ex: 150.50" required>
        </div>

        <div class="actions">
            <a href="/" class="btn btn-voltar">← Voltar</a>
            <button type="submit" class="btn btn-salvar">Salvar Fazenda</button>
        </div>

    </form>

</div>

</body>
</html>
