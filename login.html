<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login | FarmLogic</title>
    <style>
        body { 
            background: #037003;
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0;
            font-family: 'Segoe UI', sans-serif; 
        }
        .login-card { 
            background: #82c490; 
            padding: 40px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.05); 
            width: 100%; 
            max-width: 380px; 
            text-align: center;
        }
        /* Logo CSS */
        .logo { font-size: 28px; font-weight: bold; color: #2F855A; margin-bottom: 25px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .logo-icon { width: 35px; height: 35px; background: #2F855A; border-radius: 8px; color: white; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        
        input { width: 100%; padding: 14px; margin: 10px 0; border: 1px solid #e2e8f0; border-radius: 12px; box-sizing: border-box; }
        button { 
            width: 100%; padding: 14px; margin-top: 15px; 
            background: #1e5a3c; /* Verde escuro solicitado */
            color: white; border: none; border-radius: 12px; 
            cursor: pointer; font-weight: 600; font-size: 16px; transition: 0.3s;
        }
        button:hover { background: #16462d; }
        .footer-link { margin-top: 20px; font-size: 0.9rem; color: #718096; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">
            <div class="logo-icon">🌱</div> FarmLogic
        </div>
        <form method="POST">
            <input type="text" name="username" placeholder="Nome de usuário" required>
            <input type="password" name="password" placeholder="Senha" required>
            <button type="submit">ACESSAR</button>
        </form>
        <div class="footer-link">Esqueci minha senha</div>
    </div>
</body>
</html>
